fail_fast: false
repos:
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [--style=file, -i] # -i does inline formatting and will rewrite the files
      - id: cpplint
        args:
          [--verbose=3, "--filter=-legal/copyright, -build/namespaces, -build/storage_class,
              -build/c++17, -build/include_subdir, -runtime/string,
              -runtime/int, -build/header_guard, -whitespace/operators,
              -whitespace/comma, -whitespace/indent, -whitespace/semicolon, -whitespace/newline,
              -whitespace/blank_line, -whitespace/braces, -whitespace/comments, -whitespace/parens,
              -readability/casting, -readability/inheritance, -readability/braces,
              -readability/utf8, -readability/multiline_comment"]
        files: \.(c|cc|cxx|cpp|cu|h|hpp|hxx)$